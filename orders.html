<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Orders | ClothZa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
        #orders-page {
            padding: 40px 80px;
            background-color: #f9fbf9;
            min-height: 80vh;
        }

        #orders-page h2 {
            text-align: center;
            font-size: 30px;
            color: var(--text-main);
        }

        .orders-list {
            max-width: 1000px;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .order-card {
            background-color: #ffffff;
            border-radius: var(--radius-md);
            border: 1px solid #f0f0f0;
            box-shadow: var(--shadow-sm);
            padding: 25px;
            transition: all 0.3s ease;
        }

        .order-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--secondary);
            padding-bottom: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-id {
            font-size: 17px;
            font-weight: 800;
            color: var(--primary);
        }

        .order-date {
            font-size: 13px;
            color: var(--text-muted);
        }

        .order-status {
            background-color: var(--secondary);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .order-items-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .order-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #f0f0f0;
        }

        .order-item-row img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 15px;
            border: 1px solid var(--card-border);
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        @media (max-width: 768px) {
            #orders-page {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <section id="header">
        <a href="index.html"><img src="logo.png" class="logo" alt="ClothZa Logo"></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a class="active" href="orders.html">Your Orders</a></li>
                <li id="lg-bag">
                    <a href="cart.html">
                        <div class="cart-icon-container">
                            <i class="fa-solid fa-bag-shopping"></i>
                            <span class="cart-badge">0</span>
                        </div>
                    </a>
                </li>
                <a href="#" id="close"><i class="fas fa-times"></i></a>
            </ul>
        </div>
        <div id="mobile">
            <a href="cart.html">
                <div class="cart-icon-container">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-badge">0</span>
                </div>
            </a>
            <i id="bar" class="fas fa-outdent"></i>
        </div>
    </section>

    <section id="orders-page">
        <h2>Your Order History</h2>
        <p style="text-align:center; color: var(--text-muted); margin-top: 5px;">Track and view details of your recent purchases</p>

        <div class="orders-list" id="ordersListContainer">
            <!-- Dynamically populated -->
        </div>
    </section>

    <footer class="section-p1">
        <div class="copyright" style="width: 100%; text-align: center;">
            <p>&copy; 2025 ClothZa. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        function loadOrders() {
            const history = JSON.parse(localStorage.getItem("orderHistory")) || [];
            const container = document.getElementById("ordersListContainer");

            if (history.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 50px 20px; background-color: #fff; border-radius: 16px; border: 1px solid #f0f0f0;">
                        <i class="fas fa-box-open" style="font-size: 55px; color: var(--card-border); margin-bottom: 15px;"></i>
                        <h3 style="color: var(--text-main); font-size: 22px;">No Orders Placed Yet</h3>
                        <p style="color: var(--text-muted); margin-bottom: 25px;">Start exploring our collection and place your first order!</p>
                        <button class="normal" onclick="window.location.href='shop.html'">Explore Collection</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = history.map(order => {
                const itemsHtml = order.items.map(item => `
                    <div class="order-item-row">
                        <div style="display: flex; align-items: center;">
                            <img src="${item.image || 's1.jpg'}" alt="${item.name}">
                            <div>
                                <div style="font-weight: 700; color: var(--text-main);">${item.name}</div>
                                <div style="font-size: 13px; color: var(--text-muted);">Qty: ${item.quantity || 1} ${item.size ? `| Size: ${item.size}` : ''}</div>
                            </div>
                        </div>
                        <div style="font-weight: 700; color: var(--primary);">₹${((parseFloat(item.price) || 0) * (parseInt(item.quantity) || 1)).toFixed(2)}</div>
                    </div>
                `).join("");

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <span class="order-id"><i class="fas fa-receipt" style="margin-right: 6px;"></i>${order.id || 'ORD-UNKNOWN'}</span>
                                <span class="order-date" style="margin-left: 15px;"><i class="far fa-calendar-alt" style="margin-right: 4px;"></i>${order.date}</span>
                            </div>
                            <span class="order-status"><i class="fas fa-check-circle" style="margin-right: 4px;"></i>${order.status || 'Confirmed'}</span>
                        </div>
                        <div class="order-items-grid">
                            ${itemsHtml}
                        </div>
                        <div class="order-footer">
                            <span style="font-size: 14px; font-weight: normal; color: var(--text-muted);">Payment: ${(order.customer && order.customer.payment === 'cod') ? 'Cash on Delivery' : 'Online Payment'}</span>
                            <span>Total Paid: <span style="color: var(--primary); font-size: 18px;">₹${order.total}</span></span>
                        </div>
                    </div>
                `;
            }).join("");
        }

        document.addEventListener("DOMContentLoaded", loadOrders);
    </script>
</body>

</html>
